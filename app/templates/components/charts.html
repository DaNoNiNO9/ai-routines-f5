{# A Chart.js canvas fed by a JSON block; forja.js builds it when Chart.js is loaded. #}
{% macro chart(id, kind, data, label, height="16rem") %}
<div class="chart-box" style="height: {{ height }};">
  <canvas data-chart="{{ id }}-data" data-kind="{{ kind }}" role="img" aria-label="{{ label }}"></canvas>
</div>
<script type="application/json" id="{{ id }}-data">{{ data|tojson }}</script>
{% endmacro %}
