# Extraction config for pybabel (see README > Traducciones).
# El orden importa: gana el primer patrón que encaja.
[extractors]
engine = scripts.babel_engine:extract_engine_messages

# Las plantillas del motor viven en un diccionario, no en llamadas a _().
[engine: app/engine/messages.py]

[python: app/**.py]
[jinja2: app/templates/**.html]
